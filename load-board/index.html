<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1efec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JTS Ops">
<title>JTS Operations — Load Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Industry design-system tokens ─────────────────────────────────────── */
:root {
  --color-bg: #f2f2f3;
  --color-surface: #e9e9ea;
  --color-text: #1d1f20;
  --color-accent: #5980a6;
  --color-accent-2: #728fab;
  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);
  --color-neutral-100: #f5f5f8; --color-neutral-800: #424244; --color-neutral-900: #2b2b2d;
  --color-accent-100: #eef6ff; --color-accent-600: #597ea3; --color-accent-700: #416180; --color-accent-800: #2c455d;
  --font-heading: "Barlow Condensed", system-ui, sans-serif;
  --font-heading-weight: 600;
  --font-body: "Barlow", system-ui, sans-serif;
  --space-1: 3.4px; --space-2: 6.8px; --space-3: 10.2px; --space-4: 13.6px; --space-6: 20.4px; --space-8: 27.2px;
  --radius-md: 4px;
  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);
  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);
  --strip-h: 48px;   /* measured at runtime */
  --shell-h: 100px;  /* measured at runtime */
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; }
h1, h2, h3 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2); }
a { color: var(--color-accent-700); text-decoration: none; }
a:hover { color: var(--color-accent-800); }
svg { display: block; }
button, input, select { font: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }

/* blueprint frame */
.blueprint { position: relative; border: 1px solid var(--color-divider); border-radius: 0; }
.blueprint > .corner { position: absolute; width: 11px; height: 11px; color: color-mix(in srgb, var(--color-text) 55%, transparent); pointer-events: none; }
.blueprint > .corner::before, .blueprint > .corner::after { content: ""; position: absolute; background: currentColor; }
.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }
.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }
.blueprint > .corner.tl { top: -6px; left: -6px; }
.blueprint > .corner.tr { top: -6px; right: -6px; }
.blueprint > .corner.bl { bottom: -6px; left: -6px; }
.blueprint > .corner.br { bottom: -6px; right: -6px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none;
  font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 14px; line-height: 1.2; color: var(--color-text);
  background: transparent; border: 1px solid var(--color-divider); padding: var(--space-2) calc(var(--space-3) * 1.2); border-radius: 0; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--color-accent); color: var(--color-bg); border-color: var(--color-accent); }
.btn-primary:hover { background: var(--color-accent-600); }
.btn-primary:active { background: var(--color-accent-700); }
.btn-secondary { border-color: var(--color-divider); }
.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }
.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }
.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); border-color: transparent; }
.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }
.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }
.btn-icon { width: 36px; height: 36px; padding: 0; }
.btn-sm { min-height: 0; height: 30px; font-size: 12.5px; }

/* forms */
.field > label { display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
.input { width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);
  background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: 0; }
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }
.grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: var(--space-2) var(--space-3); }

/* cards / tags / tables */
.card { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); border-radius: 0; background: transparent; border: 1px solid var(--color-divider); }
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }
.tag { display: inline-flex; align-items: center; font-size: 11px; letter-spacing: 0.02em; padding: 3px 10px; border-radius: 0; }
.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }
.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 60%, transparent); padding: var(--space-2); border-bottom: 1px solid var(--color-divider); }
.table td { padding: var(--space-2); border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent); }
.table .r { text-align: right; }
.kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); }
.spacer { flex: 1; }

/* ── Login ──────────────────────────────────────────────────────────────── */
#login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
#login .card { width: min(380px, 100%); padding: 28px 28px 24px; background: var(--color-surface); gap: var(--space-3); }
#login .mark { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
#login h1 { margin: 0; font-size: 26px; letter-spacing: 0.03em; text-transform: uppercase; }
#login .err { font-size: 12.5px; color: #c40000; min-height: 18px; }
.user-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--color-accent-700); white-space: nowrap; }
.user-chip .tag { font-size: 10px; padding: 1px 7px; }
#users { max-width: 900px; padding: var(--space-6) var(--space-6) var(--space-8); }
#users .fac .role { font-size: 11px; }
.hidden { display: none !important; }

/* ── App shell ──────────────────────────────────────────────────────────── */
#strip { position: sticky; top: 0; z-index: 60; background: #f1efec; border-bottom: 1px solid #c8c4bd; }
#strip .title { display: flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 12.5px; color: #1b1d1e; }
#menubar { display: flex; align-items: stretch; border-top: 1px solid #dcd8d1; background: linear-gradient(#fbfaf8, #eceae6); overflow-x: auto; scrollbar-width: none; }
#menubar::-webkit-scrollbar { display: none; }
.menu > span { white-space: nowrap; }
.menu { position: relative; display: flex; align-items: center; gap: 5px; padding: 4px 11px; font-size: 12.5px; color: #1b1d1e; cursor: default; user-select: none; }
.menu.hot { background: #dfe7ef; }
.menu.open { box-shadow: inset 0 0 0 1px #a8bed4; }
.menu-dd { position: absolute; top: 100%; left: 0; min-width: 212px; background: #fbfaf8; border: 1px solid #a8a49d; box-shadow: 2px 3px 7px rgba(0,0,0,0.18); padding: 3px 0; z-index: 70; }
.menu-it { padding: 4px 14px; font-size: 12.5px; white-space: nowrap; cursor: pointer; color: #1b1d1e; }
.menu-it:hover { background: #dfe7ef; }
#nav { position: sticky; top: var(--strip-h); z-index: 50; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); padding: 10px var(--space-6); border-bottom: 1px solid var(--color-divider); background: var(--color-bg); }
#nav .brand { display: flex; align-items: center; gap: 10px; margin-right: var(--space-4); }
#nav .brand-name { font-family: var(--font-heading); font-weight: 600; font-size: 19px; letter-spacing: 0.03em; text-transform: uppercase; }
#nav .navbtn { color: var(--color-text); opacity: 0.75; }
#nav .navbtn.on { color: var(--color-accent-700); opacity: 1; box-shadow: inset 0 -2px 0 var(--color-accent); }
#nav .btn-icon.on { background: color-mix(in srgb, var(--color-accent) 14%, transparent); border-color: var(--color-accent); color: var(--color-accent-700); }
main { width: 100%; margin: 0 auto; }
.page-head { display: flex; align-items: baseline; gap: var(--space-3); flex-wrap: wrap; }
.page-head h1 { margin: 0; letter-spacing: 0.03em; text-transform: uppercase; }

/* ── Board ──────────────────────────────────────────────────────────────── */
#board { max-width: 1400px; padding: var(--space-4) var(--space-6) var(--space-8); }
.ctl-row { display: flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.stepper { display: flex; align-items: center; border: 1px solid #a8a49d; background: #fbfaf8; }
.stepper .btn { min-height: 0; padding: 4px 8px; }
.stepper input { min-height: 0; height: 28px; border: none; border-left: 1px solid #d8d4cd; border-right: 1px solid #d8d4cd; width: 150px; font-size: 12.5px; }
.seg { display: flex; }
.seg button { padding: 5px 12px; font-size: 12.5px; font-family: var(--font-body); cursor: pointer; border: 1px solid #a8a49d; background: #fbfaf8; color: #1b1d1e; font-weight: 400; }
.seg button + button { border-left: none; }
.seg button.on { background: var(--color-accent); color: #fff; font-weight: 700; }
.search-wrap { position: relative; flex: 1; }
.search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: 0.5; }
.search-wrap input { padding-left: 34px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px var(--space-4); align-items: center; margin-bottom: 8px; font-size: 12px; white-space: nowrap; }
.stats > div { flex: none; }
.grid-wrap { overflow-x: auto; border: 1px solid #808080; background: #fff; }
.grid { width: 100%; border-collapse: collapse; font-family: var(--font-body); }
.grid th { padding: 3px 6px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.01em; background: linear-gradient(#fdfdfd, #dadada);
  border-right: 1px solid #7f7f7f; border-bottom: 1px solid #7f7f7f; color: #1b1d1e; cursor: pointer; white-space: nowrap; position: sticky; top: 0; user-select: none; }
.grid th.on { color: #0a2fbd; }
.grid th.nosort { cursor: default; }
.grid td { padding: 2px 6px; border-right: 1px solid #7f7f7f; border-bottom: 1px solid #7f7f7f; font-size: 12px; line-height: 18px; white-space: nowrap; font-weight: 700; color: #1b1d1e; background: #fff; }
.grid .c { text-align: center; } .grid .l { text-align: left; } .grid .r { text-align: right; }
.grid td.pale { background: #fbf7d3; }
.grid td.file { color: #0a2fbd; cursor: pointer; }
.grid td.hot { background: #f00000 !important; color: #fff !important; }
.grid td.trin { background: #eef0f3; font-weight: 600; }
.grid td.orig { color: #3b3405; }
.grid td.driven { background: #b5a24d; color: #241f04; }
.grid td.green { background: #8cef8c; color: #0d2e0d; }
.grid td.carrier { font-size: 11.5px; font-weight: 600; }
.grid td.carrier.unc { color: #c40000; font-weight: 700; }
.grid td.status { font-size: 11px; font-weight: 600; }
.grid td.status.hot-txt { color: #c40000; }
.grid td.act { font-weight: 400; padding: 1px 4px; }
.grid td.act > div { display: flex; gap: 2px; justify-content: flex-end; align-items: center; }
.grid td.act .btn { min-height: 0; }
.grid td.act .tender { padding: 1px 7px; font-size: 11px; }
.grid td.act .btn-icon { width: 22px; height: 20px; }
.empty { padding: var(--space-6); text-align: center; font-size: 14px; }

/* ── Builder ────────────────────────────────────────────────────────────── */
#builder { max-width: 980px; padding: var(--space-6) var(--space-6) var(--space-8); display: flex; flex-direction: column; gap: 32px; }
.totals { position: sticky; top: calc(var(--shell-h) + 8px); z-index: 40; display: flex; align-items: center; gap: 32px; padding: var(--space-3) var(--space-4); background: var(--color-surface); }
.totals .n { font-family: var(--font-heading); font-size: 26px; line-height: 1.1; }
.totals .n small { font-size: 13px; }
.sec { display: flex; flex-direction: column; gap: var(--space-3); }
.sec-head { display: flex; align-items: center; gap: var(--space-2); }
.sec-head h2 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 0.04em; }
.stop-head { display: flex; align-items: center; gap: var(--space-2); }
.lines { border-top: 1px solid var(--color-divider); padding-top: var(--space-2); display: flex; flex-direction: column; gap: 8px; }
.line-head { display: flex; gap: 8px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); }
.line-row { display: flex; gap: 8px; align-items: center; }
.w80 { width: 80px; flex: none; } .w100 { width: 100px; flex: none; } .w170 { width: 170px; flex: none; } .w36 { width: 36px; flex: none; }
.allin { min-height: 36px; display: flex; align-items: center; font-family: var(--font-heading); font-size: 22px; }

/* ── Tender ─────────────────────────────────────────────────────────────── */
#tender-wrap { max-width: 940px; padding: var(--space-6); }
#tender-sheet { background: var(--color-surface); padding: 40px; display: flex; flex-direction: column; gap: 24px; }
.t-head { display: flex; align-items: flex-start; gap: var(--space-4); }
.t-co { font-family: var(--font-heading); font-weight: 600; font-size: 24px; text-transform: uppercase; letter-spacing: 0.03em; }
.t-title { font-family: var(--font-heading); font-size: 30px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-accent-700); line-height: 1; }
.t-band { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); border-top: 1px solid var(--color-divider); border-bottom: 1px solid var(--color-divider); padding: var(--space-3) 0; }
.t-row { display: flex; justify-content: space-between; }
.t-row.total { font-weight: 700; border-top: 1px solid var(--color-divider); margin-top: 4px; padding-top: 4px; }
.t-stop { display: flex; flex-direction: column; gap: var(--space-2); }
.t-stop.drop { border-top: 1px solid var(--color-divider); padding-top: var(--space-3); }
.t-stop-label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent-700); font-weight: 600; }
.t-totals { display: flex; gap: var(--space-6); padding: var(--space-3) var(--space-4); align-items: center; border-color: var(--color-accent); }
.t-totals .n { font-family: var(--font-heading); font-size: 20px; }
.t-totals .n small { font-size: 12px; }
.t-totals .rate { font-family: var(--font-heading); font-size: 22px; color: var(--color-accent-700); }
.sig { display: flex; gap: var(--space-6); margin-top: var(--space-2); }
.sig .rule { border-bottom: 1px solid var(--color-text); height: 26px; }

/* ── File view rail ─────────────────────────────────────────────────────── */
#tender-wrap { max-width: 1160px; }
.file-layout { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: var(--space-4); align-items: start; }
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(var(--shell-h) + 12px); }
.rail button { text-align: left; font-family: var(--font-heading); font-weight: 600; font-size: 14px; letter-spacing: 0.03em; text-transform: uppercase; padding: 9px 12px; background: #fbfaf8; border: 1px solid #a8a49d; color: var(--color-text); cursor: pointer; line-height: 1.2; }
.rail button:hover { background: #dfe7ef; }
.rail button.on { background: var(--color-accent); color: #fff; border-color: var(--color-accent); }
.rail .sub { display: block; font-family: var(--font-body); font-weight: 400; font-size: 11px; text-transform: none; letter-spacing: 0; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cond { display: flex; }
.cond button { flex: 1; padding: 8px 10px; font-size: 13px; font-family: var(--font-body); cursor: pointer; border: 1px solid #a8a49d; background: #fbfaf8; color: #1b1d1e; }
.cond button + button { border-left: none; }
.cond button.on { color: #fff; font-weight: 700; }
.cond button.on.ok { background: #2e7d32; border-color: #2e7d32; }
.cond button.on.late { background: #c47a00; border-color: #c47a00; }
.cond button.on.down { background: #c40000; border-color: #c40000; }
.log { display: flex; flex-direction: column; }
.log > div { padding: 8px 0; border-top: 1px solid var(--color-divider); font-size: 13px; }
.log time { display: block; font-size: 11px; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.grid td.status .late, .lc .st .late { color: #c47a00; font-weight: 700; }
.grid td.status .down, .lc .st .down { color: #c40000; font-weight: 700; }
.lc.hot .st .late, .lc.hot .st .down { color: #fff; }
body.m .file-layout { grid-template-columns: 1fr; }
body.m .rail { position: static; flex-direction: row; }
body.m .rail button { flex: 1; text-align: center; padding: 8px 4px; font-size: 12px; }
body.m .rail .sub { display: none; }

/* ── Directory ──────────────────────────────────────────────────────────── */
#directory { max-width: 1160px; padding: var(--space-6) var(--space-6) var(--space-8); }
.dir-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); align-items: start; }
.fac { display: flex; gap: var(--space-2); align-items: center; padding: 10px 0; border-top: 1px solid var(--color-divider); }
.dir-form { border-top: 1px solid var(--color-divider); padding-top: var(--space-3); }

/* ── Mobile layout (body.m) — set automatically under 760px or by the toggle ── */
body.m { padding-bottom: calc(66px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden; }
body.m #strip { display: none; }
body.m #nav { top: 0; padding: 8px 12px; gap: 8px; flex-wrap: nowrap; }
body.m #nav .brand { margin-right: 0; flex: 1; min-width: 0; gap: 8px; }
body.m #nav .brand-name { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.m #nav .brand .tag, body.m #nav .navbtn, body.m #nav .newload, body.m #nav .user-chip .uname, body.m #nav .signout { display: none; }
body.m #nav .user-chip .tag { font-size: 10px; }
#tabbar { display: none; }
body.m #tabbar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 55; background: #fbfaf8; border-top: 1px solid #c8c4bd; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
#tabbar .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: var(--font-heading); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text); opacity: 0.7; background: none; border: 0; padding: 4px 0; cursor: pointer; }
#tabbar .tab.on { color: var(--color-accent-700); opacity: 1; }
#tabbar .tab.primary { background: var(--color-accent); color: #fff; opacity: 1; }
#tabbar .btn { flex: 1; min-height: 40px; }
body.m main { padding-inline: 16px; }
body.m #board, body.m #builder, body.m #tender-wrap, body.m #directory, body.m #users { padding-top: 12px; }
body.m .page-head h1 { font-size: 24px !important; }
body.m .page-head .text-muted { display: none; }
body.m .stepper input { width: 130px; }
body.m .ctl-row[style*="nowrap"] { flex-wrap: nowrap !important; }
body.m .search-wrap { min-width: 0; }
body.m .stats { font-size: 11.5px; gap: 2px 12px; }
body.m .grid-wrap { display: none; }
.cards { display: none; }
body.m .cards { display: flex; flex-direction: column; gap: 8px; }
.lc { background: #fff; border: 1px solid #808080; border-left: 5px solid #8cef8c; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; font-size: 13px; font-weight: 600; color: #1b1d1e; }
.lc.hot { border-left-color: #f00000; }
.lc .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lc .row > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lc .file { color: #0a2fbd; font-weight: 700; font-size: 15px; }
.lc .st { margin-left: auto; font-size: 11px; padding: 2px 8px; background: #eef0f3; flex: none; }
.lc.hot .st { background: #f00000; color: #fff; }
.lc .orig { background: #fbf7d3; color: #3b3405; padding: 0 4px; }
.lc .orig.driven { background: #b5a24d; color: #241f04; }

function saveDraft() {
  const d = clone(S.draft);

  const exists = S.loads.some(l => l.id === d.id);
  const loads = exists ? S.loads.map(l => l.id === d.id ? d : l) : [d, ...S.loads];
  const addFac = (list, st) => (st.name && !list.some(x => x.name.toLowerCase() === st.name.toLowerCase()))
    ? [...list, { id: uid(), name: st.name, address: st.address, city: st.city, st: st.st, zip: st.zip, contact: st.contact, phone: st.phone }] : list;
  let shippers = S.shippers, receivers = S.receivers;

function customerUpdateMail(l, ev, stopEntry, note) {
  const t = trackOf(l), st = stopEntry ? stopEntry.stop : null, now = new Date();
  const s = [];
  s.push('Hello,', '', `Load update for file ${l.fileNo} (${route(l)}):`, '');
  s.push(`${ev[1].toUpperCase()}${st ? ` — ${[st.name, [st.city, st.st].filter(Boolean).join(', ')].filter(Boolean).join(', ')}` : ''}`);
  s.push(`Time: ${now.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' })}`);
  if (st && st.ref) s.push(`${stopEntry.kind === 'pickup' ? 'PU' : 'DEL'} #: ${st.ref}`);
  if (t.location) s.push(`Current location: ${t.location}${t.miles ? ` (${fmt(num(t.miles))} mi from next stop)` : ''}`);
  if (t.eta) s.push(`ETA next stop: ${new Date(t.eta).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}`);
  s.push(`Status: ${t.condition || 'On time'}`);
  if (note) s.push('', note);
  const cr = carrierOf(l);
  if (cr.name) s.push('', `Carrier: ${cr.name}${cr.driver ? ` · Driver ${cr.driver}` : ''}${cr.tractor ? ` · Tractor ${cr.tractor}` : ''}${cr.trailer ? ` / Trailer ${cr.trailer}` : ''}`);
  s.push('', 'Thank you,', S.user ? S.user.name : '', COMPANY.name, `${COMPANY.phone} · ${COMPANY.email}`);
  return `mailto:${l.customerEmail || ''}?subject=${encodeURIComponent(`Load update — File ${l.fileNo} — ${ev[1]} — ${route(l)}`)}&body=${encodeURIComponent(s.join('\n'))}`;
}
function updateLoad(id, fn) { S.loads = S.loads.map(l => { if (l.id !== id) return l; const c = clone(l); fn(c); return c; }); persist(); }

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const login = $('#login'), strip = $('#strip'), nav = $('#nav'), view = $('#view');
  document.body.classList.toggle('m', isMobile());
  if (!S.user) {
    login.classList.remove('hidden'); strip.classList.add('hidden'); nav.classList.add('hidden'); view.innerHTML = '';
    login.innerHTML = renderLogin(); const u = $('#login-user'); if (u) u.focus();
    return;
  }
  document.body.classList.toggle('m', isMobile());
  login.classList.add('hidden'); strip.classList.remove('hidden'); nav.classList.remove('hidden');
  if (S.view === 'users' && S.user.role !== 'admin') S.view = 'board';
  if (S.view === 'builder' && !S.draft) S.view = 'board';
  if (S.view === 'tender' && !S.loads.some(l => l.id === S.tenderId)) S.view = 'board';
  renderShell();
  const v = $('#view');
  if (S.view === 'board') { v.innerHTML = renderBoard(); renderBoardBody(); }
  else if (S.view === 'builder') v.innerHTML = renderBuilder();
  else if (S.view === 'tender') v.innerHTML = renderFile(S.loads.find(l => l.id === S.tenderId));
  else if (S.view === 'directory') v.innerHTML = renderDirectory();
  else if (S.view === 'users') v.innerHTML = renderUsers();
  measureShell();
}
function measureShell() {
  const strip = $('#strip'), nav = $('#nav');
  document.documentElement.style.setProperty('--strip-h', strip.offsetHeight + 'px');
  document.documentElement.style.setProperty('--shell-h', (strip.offsetHeight + nav.offsetHeight) + 'px');
}

// ── Actions ────────────────────────────────────────────────────────────────
const ACT = {
  goBoard: () => { set({ view: 'board', openMenu: null }); window.scrollTo(0, 0); },
  goDirectory: () => { set({ view: 'directory', openMenu: null }); window.scrollTo(0, 0); },
  newLoad: () => { set({ draft: blankDraft(), view: 'builder', openMenu: null }); window.scrollTo(0, 0); },
  menu: el => { const it = MENUS[+el.dataset.mi].items[+el.dataset.ii]; it.act(); },
  datePrev: () => set({ boardDate: shift(S.boardDate, S.dateScope === 'week' ? -7 : -1), dateScope: S.dateScope === 'all' ? 'day' : S.dateScope }),
  dateNext: () => set({ boardDate: shift(S.boardDate, S.dateScope === 'week' ? 7 : 1), dateScope: S.dateScope === 'all' ? 'day' : S.dateScope }),
  dateToday: () => set({ boardDate: todayISO(), dateScope: 'day' }),
  dateSet: el => set({ boardDate: el.value || S.boardDate, dateScope: S.dateScope === 'all' ? 'day' : S.dateScope }),
  scope: el => set({ dateScope: el.dataset.scope }),
  refresh: () => reloadFromStore(),
  statusFilter: el => { S.statusFilter = el.value; renderBoardBody(); },
  sort: el => { const k = el.dataset.key; S.sortDir = S.sortKey === k ? -S.sortDir : 1; S.sortKey = k; renderBoardBody(); },
  view: el => { S.fileTab = 'tender'; set({ tenderId: el.dataset.id, view: 'tender' }); window.scrollTo(0, 0); },
  edit: el => { const l = S.loads.find(x => x.id === el.dataset.id); if (l) { set({ draft: clone(l), view: 'builder' }); window.scrollTo(0, 0); } },
  delete: el => { const l = S.loads.find(x => x.id === el.dataset.id); if (l && confirm('Delete file ' + l.fileNo + '?')) set({ loads: S.loads.filter(x => x.id !== l.id) }); },
  print: () => window.print(),
  // builder
  cancel: () => { set({ draft: null, view: 'board' }); window.scrollTo(0, 0); },
  save: () => saveDraft(),
  draftStatus: el => { S.draft.status = el.value; },
  facility: el => {
    const kind = el.dataset.kind, i = +el.dataset.i, id = el.value;
    const src = (kind === 'pickups' ? S.shippers : S.receivers).find(x => x.id === id);
    const st = S.draft[kind][i]; st.facilityId = id;
    if (src) { st.name = src.name; st.address = src.address; st.city = src.city; st.st = src.st; st.zip = src.zip; st.contact = src.contact; st.phone = src.phone; }
    render();
  },
  dropIdx: el => { S.draft.pickups[+el.dataset.i].lines[+el.dataset.li].dropIdx = parseInt(el.value) || 0; builderDerived(); },
  addStop: el => { const k = el.dataset.kind; S.draft[k].push(k === 'pickups' ? { ...blankStop(), lines: [blankLine()] } : blankStop()); render(); },
  rmStop: el => {
    const k = el.dataset.kind, i = +el.dataset.i; S.draft[k].splice(i, 1);
    if (k === 'drops') S.draft.pickups.forEach(p => p.lines.forEach(l => { if (l.dropIdx >= S.draft.drops.length) l.dropIdx = 0; }));
    render();
  },
  addLine: el => { S.draft.pickups[+el.dataset.i].lines.push(blankLine()); render(); },
  rmLine: el => { S.draft.pickups[+el.dataset.i].lines.splice(+el.dataset.li, 1); render(); },
  layoutPref: el => setLayout(el.dataset.v),
  toggleLayout: () => setLayout(isMobile() ? 'desktop' : 'mobile'),
  sortSel: el => { S.sortKey = el.value; renderBoardBody(); },
  sortDir: el => { S.sortDir = -S.sortDir; el.textContent = S.sortDir > 0 ? '▲ Asc' : '▼ Desc'; renderBoardBody(); },
  // file tabs: carrier + tracking
  fileTab: el => { S.fileTab = el.dataset.tab; render(); window.scrollTo(0, 0); },
  saveCarrier: () => {
    const d = S.carrierDraft, id = d._id;
    updateLoad(id, l => {
      l.carrier = { ...blankCarrier(), ...d }; delete l.carrier._id;
      l.carrierName = d.name.trim(); l.carrierEmail = d.email.trim();
      if (l.carrierName && HOT.includes(l.status)) l.status = 'Booked';
      l.tracking = trackOf(l); l.tracking.log.push({ at: Date.now(), by: S.user.name, kind: 'carrier', text: `Carrier ${l.carrierName || '(blank)'} assigned${d.driver ? ` · Driver ${d.driver}` : ''}${d.tractor ? ` · Tractor ${d.tractor}` : ''}${d.trailer ? ` / Trailer ${d.trailer}` : ''}` });
    });
    S.carrierDraft = null; render();
  },
  resetCarrier: () => { S.carrierDraft = null; render(); },
  clearCarrier: () => {
    const id = S.carrierDraft._id; if (!confirm('Remove the carrier from this file and set it back to Open?')) return;
    updateLoad(id, l => { l.carrier = blankCarrier(); l.carrierName = ''; l.carrierEmail = ''; if (!['Delivered', 'Invoiced', 'Cancelled'].includes(l.status)) l.status = 'Open'; l.tracking = trackOf(l); l.tracking.log.push({ at: Date.now(), by: S.user.name, kind: 'carrier', text: 'Carrier removed — file back to Open' }); });
    S.carrierDraft = null; render();
  },
  cond: el => { S.trackDraft.condition = el.dataset.v; document.querySelectorAll('.cond button').forEach(b => { b.className = b.dataset.v === el.dataset.v ? 'on ' + ({ 'On time': 'ok', 'Running late': 'late', 'Breakdown': 'down' }[el.dataset.v]) : ''; }); },
  saveCheck: () => {
    const d = S.trackDraft, id = d._id, l0 = S.loads.find(x => x.id === id), stops = stopList(l0);
    const stop = stops.find(x => x.key === d.nextStop);
    updateLoad(id, l => {
      const t = trackOf(l);
      Object.assign(t, { location: d.location, miles: d.miles, nextStop: d.nextStop, eta: d.eta, condition: d.condition, notes: d.notes, updatedAt: Date.now() });
      t.log.push({ at: Date.now(), by: S.user.name, kind: 'check', text: `Check call: ${d.location || 'location not given'}${d.miles ? ` · ${fmt(num(d.miles))} mi from ${stop ? stop.label : 'next stop'}` : ''}${d.eta ? ` · ETA ${new Date(d.eta).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}` : ''} · ${d.condition}${d.notes ? ` — ${d.notes}` : ''}` });
      l.tracking = t;
      if (['Booked', 'Dispatched'].includes(l.status) && d.location) l.status = 'In Transit';
    });
    render();
  },
  evType: el => { S.trackDraft.evType = el.value; const kind = (EVENTS.find(e => e[0] === el.value) || EVENTS[0])[2]; const l = S.loads.find(x => x.id === S.trackDraft._id); const first = stopList(l).find(x => x.kind === kind); S.trackDraft.evStop = first ? first.key : ''; render(); },
  emailUpdate: () => {
    const d = S.trackDraft, id = d._id, l = S.loads.find(x => x.id === id);
    const ev = EVENTS.find(e => e[0] === d.evType) || EVENTS[0], stop = stopList(l).find(x => x.key === d.evStop);
    const href = customerUpdateMail(l, ev, stop, d.evNote);
    updateLoad(id, c => {
      const t = trackOf(c);
      t.log.push({ at: Date.now(), by: S.user.name, kind: 'email', text: `Customer update: ${ev[1]}${stop ? ` — ${stop.label}` : ''}${d.evNote ? ` — ${d.evNote}` : ''}` });
      c.tracking = t;
      if (ev[0] === 'checkout_shipper' && !['Delivered', 'Invoiced', 'Cancelled'].includes(c.status)) c.status = 'In Transit';
      if (ev[0] === 'checkin_shipper' && ['Booked'].includes(c.status)) c.status = 'Dispatched';
      if (ev[0] === 'unloaded' && c.drops.length === 1) c.status = 'Delivered';
      if (ev[0] === 'unloaded' && c.drops.length > 1 && stop && stop.key === 'd' + (c.drops.length - 1)) c.status = 'Delivered';
    });
    S.trackDraft.evNote = '';
    window.location.href = href;
    render();
  },
  // auth + users
  goUsers: () => { set({ view: 'users', openMenu: null }); window.scrollTo(0, 0); },
  signOut: () => { clearSession(); S.user = null; S.draft = null; S.view = 'board'; S.openMenu = null; render(); },
  userRole: el => { S.userDraft.role = el.value; },
  addUser: () => {
    const d = S.userDraft, uname = d.username.trim().toLowerCase();
    if (!d.name.trim() || !uname || !d.password) { alert('Name, username and password are required.'); return; }
    if (S.users.some(x => x.username.toLowerCase() === uname)) { alert('That username is already taken.'); return; }
    const salt = newSalt();
    S.users = [...S.users, { id: 'u-' + uid(), name: d.name.trim(), initials: (d.initials || d.name.split(/\s+/).map(w => w[0]).join('')).toUpperCase().slice(0, 3), username: uname, role: d.role, salt, hash: hashPw(salt, d.password) }];
    S.userDraft = { name: '', initials: '', username: '', password: '', role: 'dispatcher' };
    saveUsers(S.users); render();
  },
  rmUser: el => { const u = S.users.find(x => x.id === el.dataset.id); if (!u || u.id === S.user.id) return; if (confirm('Remove user ' + u.username + '?')) { S.users = S.users.filter(x => x.id !== u.id); saveUsers(S.users); render(); } },
  resetPw: el => {
    const u = S.users.find(x => x.id === el.dataset.id); if (!u) return;
    const pw = prompt('New password for ' + u.username + ':'); if (!pw) return;
    u.salt = newSalt(); u.hash = hashPw(u.salt, pw); saveUsers(S.users); alert('Password updated for ' + u.username + '.');
  },
  // directory
  addFac: el => { const k = el.dataset.kind, cur = S.dirDraft[k]; if (!cur.name.trim()) return; S[k] = [...S[k], { id: uid(), ...cur }]; S.dirDraft[k] = blankFac(); persist(); render(); },
  rmFac: el => { const k = el.dataset.kind; S[k] = S[k].filter(x => x.id !== el.dataset.id); persist(); render(); }
};
const CHANGE_ACTS = new Set(['dateSet', 'statusFilter', 'draftStatus', 'facility', 'dropIdx', 'userRole', 'sortSel', 'evType']);

const app = $('#app');
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || CHANGE_ACTS.has(el.dataset.act)) return;
  if (el.tagName === 'BUTTON' && el.disabled) return;
  e.stopPropagation();
  ACT[el.dataset.act](el, e);
});
app.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (el && CHANGE_ACTS.has(el.dataset.act)) ACT[el.dataset.act](el, e);
});
app.addEventListener('input', e => {
  const el = e.target; const path = el.dataset.bind; if (!path) return;
  setPath(S, path, el.value);
  if (path === 'search') renderBoardBody();
  else if (path.startsWith('draft.')) builderDerived();
});

app.addEventListener('submit', e => {
  const form = e.target.closest('[data-form="login"]'); if (!form) return;
  e.preventDefault();
  const u = signIn(form.username.value, form.password.value);
  if (!u) { S.loginErr = 'Wrong username or password.'; $('#login-err').textContent = S.loginErr; form.password.value = ''; form.password.focus(); return; }
  writeSession(u.username, form.remember.checked);
  S.user = u; S.users = loadUsers(); S.loginErr = ''; render();
});

// menubar: click toggles, hover switches once one is open, outside click / Escape closes
const menubar = $('#menubar');
menubar.addEventListener('click', e => {
  if (e.target.closest('[data-act]')) return;
  const m = e.target.closest('[data-menu]'); if (!m) return;
  e.stopPropagation();
  S.openMenu = S.openMenu === m.dataset.menu ? null : m.dataset.menu; renderMenubar();
});
menubar.addEventListener('mouseover', e => {
  const m = e.target.closest('[data-menu]'); const label = m ? m.dataset.menu : null;
  if (label === S.hoverMenu) return;
  S.hoverMenu = label; if (S.openMenu && label) S.openMenu = label; renderMenubar();
});
menubar.addEventListener('mouseleave', () => { if (S.hoverMenu) { S.hoverMenu = null; renderMenubar(); } });
document.addEventListener('pointerdown', e => { if (S.openMenu && !(e.target.closest && e.target.closest('[data-menubar]'))) { S.openMenu = null; renderMenubar(); } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.openMenu) { S.openMenu = null; renderMenubar(); } });
window.addEventListener('storage', e => { if (!e.key || e.key === STORE_KEY) reloadFromStore(); });
let wasMobile = isMobile();
window.addEventListener('resize', () => { measureShell(); if (isMobile() !== wasMobile) { wasMobile = isMobile(); render(); } });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureShell);

persist();
render();
</script>
</body>
